<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.tailwindcss.com"></script><title>RetainrFlow</title><script defer="defer" src="/static/js/main.fa787f2d.js"></script><link href="/static/css/main.d0bd4142.css" rel="stylesheet"></head><body><div id="root"></div></body><script>document.querySelectorAll('a[href^="#"]').forEach(e=>{e.addEventListener("click",function(e){e.preventDefault(),document.querySelector(this.getAttribute("href")).scrollIntoView({behavior:"smooth"})})});const mobileMenuButton=document.getElementById("mobileMenuButton"),navLinks=document.getElementById("navLinks");mobileMenuButton.addEventListener("click",()=>{navLinks.classList.toggle("active")});const dropdowns=document.querySelectorAll(".dropdown");dropdowns.forEach(e=>{e.querySelector(".nav-link").addEventListener("click",t=>{window.innerWidth<=768&&(t.preventDefault(),e.classList.toggle("active"))})}),document.addEventListener("click",e=>{navLinks.contains(e.target)||mobileMenuButton.contains(e.target)||navLinks.classList.remove("active")})</script></html>
